<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字境 · 复习考核</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<link rel="stylesheet" href="math.css?v=20261010b"><link rel="stylesheet" href="review.css?v=20261014a"><link rel="stylesheet" href="icons.css?v=20261015b"></head>
<body><header><a class="home-link" href="index.html#select" aria-label="← 返回选字" title="← 返回选字"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H5m6-6-6 6 6 6"/></svg></a><b>字境 · 复习考核</b></header>
<main><div class="intro"><div class="eyebrow">小 小 汉 字 家</div><h1>复习一下</h1><p>👄 → ✏️</p></div>
<section class="game" id="review-setup"><h2>抽 5 个字</h2><p id="review-pool"></p><p></p><p class="review-note">家长陪同 · 读音人工核对 · 书写自动检查</p><button class="primary" id="review-start" aria-label="开始考核" title="开始考核"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 5 11 7-11 7Z"/></svg><span>开始</span></button><a class="home-link" href="index.html#select" id="review-learn" hidden>先去认识几个字</a><div id="review-history" hidden></div></section>
<section class="game" id="review-play" hidden aria-label="汉字考核"><div class="top"><span id="review-round"></span><span id="review-stage"></span></div>
<div id="review-reading"><h2>👄 读一读</h2><div class="review-glyph" id="review-char"></div><p>读给家长听</p><button class="primary" id="review-reveal" aria-label="读好了，核对读音" title="读好了，核对读音"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12 4 4L19 6"/></svg><span>核对</span></button><div id="review-answer" hidden><p class="review-pinyin" id="review-pinyin"></p><p id="review-word"></p><button class="secondary" id="review-audio" aria-label="听参考读音" title="听参考读音"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 9h4l5-4v14l-5-4H3ZM16 8q4 4 0 8m3-11q7 7 0 14"/></svg></button><p class="review-note">家长核对（不自动识别读音）</p><div class="actions"><button class="secondary" id="review-read-retry" aria-label="家长确认：还需练习" title="家长确认：还需练习"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg><span>再练</span></button><button class="primary" id="review-read-pass" aria-label="家长确认：读对了" title="家长确认：读对了"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 12 4 4L19 6"/></svg><span>读对了</span></button></div></div></div>
<div id="review-writing" hidden><h2>✏️ 写一写</h2><p>默写刚才的字</p><div class="review-grid" id="review-board" aria-label="空白田字格书写区域"></div><p id="review-write-status" role="status" aria-live="polite"></p><div class="actions"><button class="secondary" id="review-hint" aria-label="显示字模提示" title="显示字模提示"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 18h6m-6 3h6M8 15a7 7 0 1 1 8 0l-1 3H9Z"/></svg></button><button class="secondary" id="review-reset" aria-label="重新书写" title="重新书写"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg></button><button class="secondary" id="review-load" hidden aria-label="重新加载字模" title="重新加载字模"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg></button></div><details class="ui-help"><summary>ⓘ 说明</summary><p>点提示、写错或重新写，会记为“再练书写”；完成后可以继续下一字。</p></details><div class="actions"><button class="secondary" id="review-skip" aria-label="跳过，记为未检查" title="跳过，记为未检查"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14m-6-6 6 6-6 6"/></svg><span>跳过</span></button><button class="primary" id="review-next" disabled aria-label="下一字" title="下一字"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></div></div>
<p id="review-feedback" role="status" aria-live="polite"></p><button class="secondary" id="review-exit" aria-label="结束本轮，不保存未完成记录" title="结束本轮，不保存未完成记录"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 4H4v16h6m2-8h9m-4-4 4 4-4 4"/></svg><span>退出</span></button><details class="ui-help"><summary>ⓘ 说明</summary><p>未完成的一轮不计入考核记录。</p></details></section>
<section class="game" id="review-result" hidden><div class="review-celebrate" aria-hidden="true">👍</div><h2>👍 真棒！</h2><p id="review-summary"></p><ul id="review-results"></ul><div class="actions"><button class="secondary" id="review-retry" aria-label="再练需要巩固的字" title="再练需要巩固的字"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m4 16 11-11 4 4L8 20H4ZM13 7l4 4"/></svg><span>再练</span></button><button class="primary" id="review-again" aria-label="重新随机抽题" title="重新随机抽题"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg><span>再来</span></button></div><details class="ui-help"><summary>ⓘ 说明</summary><p>结果只保存在当前浏览器，不改变原有识字通关记录。</p></details></section>
<p id="review-storage" role="status"></p></main>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.2/dist/hanzi-writer.min.js"></script><script type="module" src="js/review.js?v=20261015ui"></script></body></html>
